[project]
name = "portmanteau"
version = "0.10.0"
description = "Portable Python utilities for data analysis: cached downloads, pinned dataset releases, ROC metrics and plots, Hamming-distance sequence pairs and graphs, notebook-sourced slide decks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pandas"]

[project.optional-dependencies]
download = ["pooch"]
releases = ["pooch", "pyarrow"]
tcr = ["tidytcells>=2.2.0,<3"]
# Everything portmanteau.tcr.publicdb needs: the TCR vocabulary plus the release cache.
publicdb = ["pooch", "pyarrow", "tidytcells>=2.2.0,<3"]
metrics = ["scikit-learn"]
plots = ["matplotlib", "seaborn", "plotly", "scikit-learn"]
sequence = ["networkx", "matplotlib", "seaborn"]
notebook = ["ipython"]
slides = ["python-pptx", "pillow", "lxml", "nbformat", "pandas"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
