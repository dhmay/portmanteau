[project]
name = "portmanteau"
version = "0.2.0"
description = "Portable Python utilities for data analysis: cached downloads, ROC metrics and plots, Hamming-distance sequence pairs and graphs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pandas"]

[project.optional-dependencies]
download = ["pooch"]
metrics = ["scikit-learn"]
plots = ["matplotlib", "seaborn", "plotly", "scikit-learn"]
sequence = ["networkx", "matplotlib", "seaborn"]
notebook = ["ipython"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
